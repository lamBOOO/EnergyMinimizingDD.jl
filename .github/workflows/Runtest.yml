

name: RunTest

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Setup
      uses: julia-actions/setup-julia@v1
      with:
        version: '1.10'  

    - name: Dependencies
      run: |
        julia -e '
          using Pkg
          Pkg.activate(".")
          Pkg.instantiate()
          Pkg.add(["Plots", "Test"])  
        '

    - name: Tests
      run: |
        julia test/Runtest.jl  

