name: Poisson varDD-PCG diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - "examples/paper/study14_poisson_vardd_pcg.jl"
      - "examples/paper/study13_poisson_structured_overlap.jl"
      - "src/Solvers.jl"
      - ".github/workflows/poisson-vardd-pcg.yml"
  workflow_dispatch:

jobs:
  run-study:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      JULIA_PKG_PRECOMPILE_AUTO: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.11"
      - uses: julia-actions/cache@v2
      - name: Instantiate project
        run: julia --project=. -e 'import Pkg; Pkg.instantiate()'
      - name: Run varDD-PCG diagnostic
        env:
          FORCE: "1"
        run: julia --project=. examples/paper/study14_poisson_vardd_pcg.jl
      - name: Print summary
        run: |
          julia --project=. -e '
            using CSV, Tables
            file = "examples/paper/data/study14_poisson_vardd_pcg_summary.csv"
            for row in Tables.rowtable(CSV.File(file))
              println(row)
            end
          '
      - uses: actions/upload-artifact@v4
        with:
          name: poisson-vardd-pcg-results
          path: examples/paper/data/study14_poisson_vardd_pcg_*.csv
          if-no-files-found: error
