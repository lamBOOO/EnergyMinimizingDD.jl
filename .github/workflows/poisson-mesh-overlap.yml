name: Poisson mesh-overlap study

on:
  pull_request:
    branches: [main]
    paths:
      - "examples/paper/study12_poisson_mesh_overlap.jl"
      - ".github/workflows/poisson-mesh-overlap.yml"
  workflow_dispatch:

jobs:
  run-study:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.11"
      - uses: julia-actions/cache@v2
      - name: Instantiate project
        run: julia --project=. -e 'import Pkg; Pkg.instantiate(); Pkg.precompile()'
      - name: Run Poisson mesh-overlap study
        env:
          FORCE: "1"
        run: julia --project=. examples/paper/study12_poisson_mesh_overlap.jl
      - name: Print iteration table
        run: |
          julia --project=. -e '
            using CSV, Tables
            file = "examples/paper/data/study12_poisson_mesh_overlap_summary.csv"
            rows = Tables.rowtable(CSV.File(file))
            println("N, overlap layers, iterations, converged, final relative residual")
            for row in rows
              println((row.N, row.overlap_layers, row.iterations, row.converged, row.final_relative_residual))
            end
          '
      - uses: actions/upload-artifact@v4
        with:
          name: poisson-mesh-overlap-results
          path: examples/paper/data/study12_poisson_mesh_overlap_*.csv
          if-no-files-found: error
